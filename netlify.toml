[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "https://calypsoai.health/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://calypsoai.health/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.calypsoai.health/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.calypsoai.health/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.calypsohealth.org/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.calypsohealth.org/*"
  to = "https://calypsohealth.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
